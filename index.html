<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINH AN HEX MAKER</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #10131c;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 24px;
      background: #1b2030;
      border: 1px solid #343b50;
      border-radius: 16px;
    }
    h1 {
      color: #48e0ff;
      text-align: center;
    }
    p {
      color: #b8c2d8;
      line-height: 1.6;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      color: #8affc1;
      background: #0b0e15;
      border: 1px solid #424b65;
      border-radius: 8px;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      color: #10131c;
      background: #48e0ff;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.85;
    }
    #status {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>MINH AN HEX MAKER</h1>
    <p>Công cụ nhập và sao chép chuỗi HEX.</p>
    <textarea id="hexInput"
      placeholder="Nhập chuỗi HEX tại đây..."></textarea>
    <button onclick="copyHex()">SAO CHÉP HEX</button>
    <button onclick="clearHex()">XÓA NỘI DUNG</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    async function copyHex() {
      const input = document.getElementById("hexInput");
      const status = document.getElementById("status");
      if (!input.value.trim()) {
        status.textContent = "Vui lòng nhập nội dung trước.";
        return;
      }
      try {
        await navigator.clipboard.writeText(input.value);
        status.textContent = "Đã sao chép nội dung!";
      } catch {
        input.focus();
        input.select();
        status.textContent =
          "Hãy sao chép nội dung đã được chọn.";
      }
    }
    function clearHex() {
      document.getElementById("hexInput").value = "";
      document.getElementById("status").textContent =
        "Đã xóa nội dung.";
    }
  </script>
</body>
</html>
